<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Motion Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="top">
  <strong id="title">—</strong>
  <span id="time">0.00 / 0.00</span>
  <button onclick="togglePlay()">⏯ space</button>
  <button onclick="toggleSkeleton()">skeleton [s]</button>
  <label><input type="checkbox" id="chk-beats" checked onchange="state.showBeats=this.checked"> beats</label>
  <label style="display:flex;align-items:center;gap:6px;">
    <span>vol</span>
    <input type="range" id="vol-slider" min="0" max="100" step="1"
           style="width:80px;" oninput="setVolume(this.value)">
    <span id="vol-label" style="min-width:28px;color:#888;">50%</span>
  </label>
  <button id="btn-export" onclick="exportData()">export</button>
  <details id="debug-wrap">
    <summary>debug ▾</summary>
    <div id="debug-box">No data yet.</div>
  </details>
</div>

<div id="main">
  <div id="viewer">
    <video id="video" preload="auto"></video>
    <canvas id="overlay"></canvas>
    <div id="timeline">
      <canvas id="tl"></canvas>
      <div id="playhead"></div>
    </div>
  </div>

  <div id="sidebar">
    <div id="info">Loading...</div>
    <div id="sidebar-tabs">
      <button class="tab-btn" onclick="switchTab('beats')">Beats</button>
      <button class="tab-btn active" onclick="switchTab('vars')">Variabler</button>
    </div>
    <div id="tab-beats" class="tab-panel">
      <div id="beat-list"></div>
    </div>
    <div id="tab-vars" class="tab-panel active">
      <div id="var-panel">
        <div id="var-loading">Laddar variabler…</div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
